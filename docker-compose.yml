# version: '3.8'

services:
  backend:
    build: 
      context: ./DOON_Heritage_Backend
      dockerfile: Dockerfile
    container_name: doon_backend
    ports:
      - "8000:8000"
    volumes:
      - ./DOON_Heritage_Backend:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    command: python manage.py runserver 0.0.0.0:8000
    restart: always

  frontend:
    build:
      context: ./DOON_Heritage_school_Frontend
      dockerfile: Dockerfile
    container_name: doon_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./DOON_Heritage_school_Frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: always